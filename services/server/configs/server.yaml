host: 127.0.0.1
port: 8080
# log_path: ""       # Leave empty to use <workspaceDir>/.mediago-drama/logs/server.log
# log_level: info    # info by default; MEDIAGO_LOG_LEVEL=debug enables diagnostic traces.
# Keep empty so each installed copy uses its own app-owned workspace.
# Never point a release build at a developer's test workspace.
workspace_dir: ""
# acp_command: codex-acp
# model_platforms: ["mediago"] # MEDIAGO_MODEL_PLATFORM=mediago,openrouter,dmxapi overrides this.
# generation_clis: [] # Optional local generation CLIs; API generation works without them.
mediago_base_url: "https://cn.whereslow.online/v1" # OpenAI-compatible NewAPI gateway.
# agent:
#   id: none       # Optional local ACP backend; the production build does not bundle one.
#   bin_dir: ""    # Directory containing <id>/agent.json; empty uses PATH commands.
# ffmpeg:
#   path: ""       # Optional explicit ffmpeg binary; MEDIAGO_FFMPEG_PATH overrides this.
#   bin_dir: ""    # Directory containing ffmpeg; MEDIAGO_FFMPEG_BIN_DIR overrides this.
# jimeng:
#   path: ""       # Optional explicit dreamina binary; MEDIAGO_JIMENG_PATH overrides this.
#   bin_dir: ""    # Directory containing dreamina; MEDIAGO_JIMENG_BIN_DIR overrides this.
# libtv:
#   path: ""       # Optional explicit libtv binary; MEDIAGO_LIBTV_PATH overrides this.
#   bin_dir: ""    # Directory containing libtv; MEDIAGO_LIBTV_BIN_DIR overrides this.
#   project_id: "" # Optional LibTV canvas project UUID; MEDIAGO_LIBTV_PROJECT_ID overrides this. Empty uses `libtv project use`.
# pippit:
#   path: ""       # Optional explicit pippit-tool-cli binary; MEDIAGO_PIPPIT_PATH overrides this.
#   bin_dir: ""    # Directory containing pippit-tool-cli; MEDIAGO_PIPPIT_BIN_DIR overrides this.
# internal_api:
#   url: ""    # ONE_INTERNAL_API_URL overrides this when set.
#   token: ""  # ONE_INTERNAL_API_TOKEN overrides this when set.
billing:
  price_overlay_path: "pricing.overlay.json" # Optional JSON file with {"prices":[...]} route price overrides.
# document_mcp:
#   session_id: ""
#   run_id: ""
#   bridge_url: ""    # MEDIAGO_DRAMA_AGENT_BRIDGE_URL overrides this when set.
#   bridge_token: ""  # MEDIAGO_DRAMA_AGENT_BRIDGE_TOKEN overrides this when set.
#   role_persona: ""
#   agent_tag: ""
#   active_document_id: ""
#   selection_text: ""
prompt:
  max_section_chars: 12000
  instruction_delivery: native # native (default) or inline rollback mode.
